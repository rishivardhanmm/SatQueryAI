services:
  inference:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: satquery
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
